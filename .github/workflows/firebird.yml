name: Firebird CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/firebird/**"
      - "scripts/tcl/firebird/**"
      - "scripts/python/firebird/**"
      - "config/firebird.xml"
      - "config/database.xml"
      - "config/ci.xml"
      - "Docker/firebird/**"
      - "tmp/THE_PLAN.md"
      - ".github/workflows/firebird.yml"
  push:
    branches:
      - "feature/firebird-**"

permissions:
  contents: read

jobs:
  windows-smoke:
    name: Windows / Firebird Embedded smoke
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner environment
        shell: pwsh
        run: |
          $PSVersionTable
          choco --version
          Get-ComputerInfo | Select-Object OsName, OsVersion, OsArchitecture

      - name: Install PSFirebird module
        shell: pwsh
        run: |
          Install-Module -Name PSFirebird -Force -Scope CurrentUser -AllowClobber
          Get-Module -ListAvailable PSFirebird | Select-Object Name, Version, Path

      - name: Provision Firebird 5.0.x Embedded
        shell: pwsh
        run: |
          $fbDir = Join-Path $env:RUNNER_TEMP 'firebird'
          Import-Module PSFirebird
          New-FirebirdEnvironment -Version 5.0.3 -Path $fbDir
          Get-ChildItem $fbDir | Select-Object Name, Length
          # Expose fbclient.dll on PATH for the rest of the workflow
          "$fbDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "FIREBIRD_HOME=$fbDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # PSFirebird's [FirebirdEnvironment]::default() picks this up so
          # later workflow steps can call cmdlets without -Environment
          "FIREBIRD_ENVIRONMENT=$fbDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Firebird ODBC driver
        shell: pwsh
        run: |
          choco install firebird-odbc -y --no-progress
          # Locate the registered driver name (32- or 64-bit hive) for downstream steps
          $hives = @(
            'HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers',
            'HKLM:\SOFTWARE\WOW6432Node\ODBC\ODBCINST.INI\ODBC Drivers'
          )
          $found = $null
          foreach ($h in $hives) {
            if (Test-Path $h) {
              $props = Get-ItemProperty $h
              $name = $props.PSObject.Properties.Name | Where-Object { $_ -match 'Firebird' } | Select-Object -First 1
              if ($name) { $found = $name; break }
            }
          }
          if (-not $found) { throw 'Firebird ODBC driver not found in registry after choco install' }
          Write-Host "Registered Firebird ODBC driver: $found"
          "FIREBIRD_ODBC_DRIVER=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tcl/Tk (Magicsplat) for tdbc::odbc smoke test
        shell: pwsh
        run: |
          choco install magicsplat-tcl-tk -y --no-progress
          # Refresh PATH from registry so the just-installed Tcl shows up
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          # Find tclsh in common Magicsplat install locations
          $candidates = @(
            'C:\Tcl\bin', 'C:\Tcl90\bin', 'C:\Tcl86\bin',
            'C:\Program Files\Tcl\bin',
            'C:\Program Files\Magicsplat\Tcl-Tk\bin',
            'C:\Program Files (x86)\Magicsplat\Tcl-Tk\bin'
          )
          $tclsh = $null
          foreach ($dir in $candidates) {
            if (Test-Path $dir) {
              $found = Get-ChildItem -Path $dir -Filter 'tclsh*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $tclsh = $found.FullName; break }
            }
          }
          if (-not $tclsh) {
            # Fall back to a recursive search under C:\ Program Files / C:\Tcl
            $found = Get-ChildItem -Path 'C:\','C:\Program Files\','C:\Program Files (x86)\' -Filter 'tclsh*.exe' -Recurse -ErrorAction SilentlyContinue -Depth 4 | Select-Object -First 1
            if ($found) { $tclsh = $found.FullName }
          }
          if (-not $tclsh) { throw "tclsh.exe not found after magicsplat-tcl-tk install" }
          Write-Host "tclsh: $tclsh"
          $tclshDir = Split-Path -Parent $tclsh
          "TCLSH=$tclsh" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$tclshDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Confirm tdbc::odbc loads
          $verify = Join-Path $env:RUNNER_TEMP 'fb_verify_tdbc.tcl'
          'package require tdbc::odbc; puts "tdbc::odbc [package require tdbc::odbc]"' | Set-Content -Path $verify -Encoding ASCII
          & $tclsh $verify
          if ($LASTEXITCODE -ne 0) { throw "tdbc::odbc not available in $tclsh" }

      # ---------------------------------------------------------------------
      # Embedded-mode ODBC connection string template (canonical, used by
      # src/firebird/fboltp.tcl, fbolap.tcl, fbotc.tcl in later phases):
      #
      #   Driver={Firebird/InterBase(r) driver};
      #   Dbname=<absolute path to .fdb>;
      #   Client=fbclient.dll;
      #   User=SYSDBA;
      #
      # Embedded mode has no host/port. SYSDBA is the implicit owner of any
      # newly-created file; no password is required when fbclient.dll loads
      # the engine in-process. The server-mode legacy form
      # (Servername=localhost) MUST NOT be used.
      # ---------------------------------------------------------------------
      - name: Smoke test - create embedded .fdb and run tdbc::odbc query
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\smoke.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          if (-not (Test-Path $fbDb)) { throw "Failed to create embedded database at $fbDb" }
          Write-Host "Created embedded database: $fbDb ($((Get-Item $fbDb).Length) bytes)"
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_smoke.tcl"
          if ($LASTEXITCODE -ne 0) { throw "tdbc::odbc smoke test failed with exit $LASTEXITCODE" }

      - name: Verify Firebird registration in database.xml + firebird.xml
        shell: pwsh
        env:
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_register.tcl"
          if ($LASTEXITCODE -ne 0) { throw "Firebird registration check failed with exit $LASTEXITCODE" }

      - name: Source-load all src/firebird/*.tcl modules
        shell: pwsh
        env:
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_modules.tcl"
          if ($LASTEXITCODE -ne 0) { throw "Firebird module load failed with exit $LASTEXITCODE" }

      - name: Build TPC-C schema on a fresh embedded .fdb
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpcc_schema.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_schema.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-C schema build failed with exit $LASTEXITCODE" }

      - name: Load 1 warehouse worth of TPC-C data + verify row counts
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpcc_load.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          # Persist the loaded .fdb path for the run-transactions step.
          "FB_LOADED_DB=$($env:FB_DB_PATH)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_load1w.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-C 1-warehouse load failed with exit $LASTEXITCODE" }

      - name: Run 200 TPC-C transactions (client-side mode)
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          FB_DB_PATH: ${{ env.FB_LOADED_DB }}
          FB_TXN_COUNT: "200"
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_runtxn.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-C transaction run failed with exit $LASTEXITCODE" }

      - name: Build TPC-H schema on a fresh embedded .fdb
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpch_schema.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_tpch_schema.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-H schema build failed with exit $LASTEXITCODE" }

      - name: Phase G - download HammerDB 5.0 release + overlay firebird files
        shell: pwsh
        run: |
          $hdbRoot = Join-Path $env:RUNNER_TEMP 'hammerdb'
          if (Test-Path $hdbRoot) { Remove-Item $hdbRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $hdbRoot | Out-Null
          $tarball = Join-Path $env:RUNNER_TEMP 'HammerDB-5.0-Prod-Win.tar.gz'
          $url = 'https://github.com/TPC-Council/HammerDB/releases/download/v5.0/HammerDB-5.0-Prod-Win.tar.gz'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $tarball -UseBasicParsing
          Write-Host "Extracting $tarball -> $hdbRoot"
          tar -xzf $tarball -C $hdbRoot
          # Tarball extracts a single top-level dir like HammerDB-5.0
          $inner = Get-ChildItem $hdbRoot -Directory | Select-Object -First 1
          Write-Host "HammerDB extracted to: $($inner.FullName)"
          # Overlay our checkout's firebird-relevant files
          Copy-Item -Path "${{ github.workspace }}\src\firebird" -Destination "$($inner.FullName)\src\" -Recurse -Force
          Copy-Item -Path "${{ github.workspace }}\config\firebird.xml" -Destination "$($inner.FullName)\config\" -Force
          Copy-Item -Path "${{ github.workspace }}\config\database.xml" -Destination "$($inner.FullName)\config\" -Force
          Copy-Item -Path "${{ github.workspace }}\scripts\tcl\firebird" -Destination "$($inner.FullName)\scripts\tcl\" -Recurse -Force
          Copy-Item -Path "${{ github.workspace }}\scripts\python\firebird" -Destination "$($inner.FullName)\scripts\python\" -Recurse -Force
          # HammerDB caches database.xml into a SQLite file on first run;
          # delete it so our updated database.xml is re-parsed.
          Get-ChildItem "$($inner.FullName)" -Filter 'database.db' -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          # fbclient.dll on PATH already. Persist HammerDB root for the next step.
          "HAMMERDB_BIN_ROOT=$($inner.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem "$($inner.FullName)\src\firebird"
          Get-ChildItem "$($inner.FullName)\config\firebird.xml"

      - name: Phase G - run hammerdbcli buildschema against firebird
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\hammerdbcli_tpcc.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DBASE = ($fbDb -replace '\\', '/')
          # Copy the CI script into the HammerDB tree so paths line up.
          Copy-Item -Path "${{ github.workspace }}\.github\workflows\scripts\fb_hammerdbcli_ci.tcl" -Destination "$env:HAMMERDB_BIN_ROOT\fb_hammerdbcli_ci.tcl" -Force
          Push-Location $env:HAMMERDB_BIN_ROOT
          try {
            Write-Host "--- HammerDB binary launch ---"
            Get-ChildItem .\bin -Filter 'tclsh*' | Select-Object Name, Length
            # hammerdbcli .bat is the Windows launcher
            $cli = if (Test-Path '.\hammerdbcli.bat') { '.\hammerdbcli.bat' } else { '.\hammerdbcli' }
            Write-Host "Running: $cli auto fb_hammerdbcli_ci.tcl"
            & $cli auto fb_hammerdbcli_ci.tcl
            if ($LASTEXITCODE -ne 0) { throw "hammerdbcli buildschema failed with exit $LASTEXITCODE" }
          } finally { Pop-Location }

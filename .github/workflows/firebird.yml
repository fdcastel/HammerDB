name: Firebird CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/firebird/**"
      - "scripts/tcl/firebird/**"
      - "scripts/python/firebird/**"
      - "config/firebird.xml"
      - "config/database.xml"
      - "config/ci.xml"
      - "Docker/firebird/**"
      - "tmp/THE_PLAN.md"
      - ".github/workflows/firebird.yml"
  push:
    branches:
      - "feature/firebird-**"

permissions:
  contents: read

jobs:
  windows-smoke:
    name: Windows / Firebird Embedded smoke
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner environment
        shell: pwsh
        run: |
          $PSVersionTable
          choco --version
          Get-ComputerInfo | Select-Object OsName, OsVersion, OsArchitecture

      - name: Install PSFirebird module
        shell: pwsh
        run: |
          Install-Module -Name PSFirebird -Force -Scope CurrentUser -AllowClobber
          Get-Module -ListAvailable PSFirebird | Select-Object Name, Version, Path

      - name: Provision Firebird 5.0.x Embedded
        shell: pwsh
        run: |
          $fbDir = Join-Path $env:RUNNER_TEMP 'firebird'
          Import-Module PSFirebird
          New-FirebirdEnvironment -Version 5.0.3 -Path $fbDir
          Get-ChildItem $fbDir | Select-Object Name, Length
          # Expose fbclient.dll on PATH for the rest of the workflow
          "$fbDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "FIREBIRD_HOME=$fbDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # PSFirebird's [FirebirdEnvironment]::default() picks this up so
          # later workflow steps can call cmdlets without -Environment
          "FIREBIRD_ENVIRONMENT=$fbDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Firebird ODBC driver
        shell: pwsh
        run: |
          choco install firebird-odbc -y --no-progress
          # Locate the registered driver name (32- or 64-bit hive) for downstream steps
          $hives = @(
            'HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers',
            'HKLM:\SOFTWARE\WOW6432Node\ODBC\ODBCINST.INI\ODBC Drivers'
          )
          $found = $null
          foreach ($h in $hives) {
            if (Test-Path $h) {
              $props = Get-ItemProperty $h
              $name = $props.PSObject.Properties.Name | Where-Object { $_ -match 'Firebird' } | Select-Object -First 1
              if ($name) { $found = $name; break }
            }
          }
          if (-not $found) { throw 'Firebird ODBC driver not found in registry after choco install' }
          Write-Host "Registered Firebird ODBC driver: $found"
          "FIREBIRD_ODBC_DRIVER=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tcl/Tk (Magicsplat) for tdbc::odbc smoke test
        shell: pwsh
        run: |
          choco install magicsplat-tcl-tk -y --no-progress
          # Refresh PATH from registry so the just-installed Tcl shows up
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          # Find tclsh in common Magicsplat install locations
          $candidates = @(
            'C:\Tcl\bin', 'C:\Tcl90\bin', 'C:\Tcl86\bin',
            'C:\Program Files\Tcl\bin',
            'C:\Program Files\Magicsplat\Tcl-Tk\bin',
            'C:\Program Files (x86)\Magicsplat\Tcl-Tk\bin'
          )
          $tclsh = $null
          foreach ($dir in $candidates) {
            if (Test-Path $dir) {
              $found = Get-ChildItem -Path $dir -Filter 'tclsh*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $tclsh = $found.FullName; break }
            }
          }
          if (-not $tclsh) {
            # Fall back to a recursive search under C:\ Program Files / C:\Tcl
            $found = Get-ChildItem -Path 'C:\','C:\Program Files\','C:\Program Files (x86)\' -Filter 'tclsh*.exe' -Recurse -ErrorAction SilentlyContinue -Depth 4 | Select-Object -First 1
            if ($found) { $tclsh = $found.FullName }
          }
          if (-not $tclsh) { throw "tclsh.exe not found after magicsplat-tcl-tk install" }
          Write-Host "tclsh: $tclsh"
          $tclshDir = Split-Path -Parent $tclsh
          "TCLSH=$tclsh" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$tclshDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Confirm tdbc::odbc loads
          $verify = Join-Path $env:RUNNER_TEMP 'fb_verify_tdbc.tcl'
          'package require tdbc::odbc; puts "tdbc::odbc [package require tdbc::odbc]"' | Set-Content -Path $verify -Encoding ASCII
          & $tclsh $verify
          if ($LASTEXITCODE -ne 0) { throw "tdbc::odbc not available in $tclsh" }

      # ---------------------------------------------------------------------
      # Embedded-mode ODBC connection string template (canonical, used by
      # src/firebird/fboltp.tcl, fbolap.tcl, fbotc.tcl in later phases):
      #
      #   Driver={Firebird/InterBase(r) driver};
      #   Dbname=<absolute path to .fdb>;
      #   Client=fbclient.dll;
      #   User=SYSDBA;
      #
      # Embedded mode has no host/port. SYSDBA is the implicit owner of any
      # newly-created file; no password is required when fbclient.dll loads
      # the engine in-process. The server-mode legacy form
      # (Servername=localhost) MUST NOT be used.
      # ---------------------------------------------------------------------
      - name: Smoke test - create embedded .fdb and run tdbc::odbc query
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\smoke.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          if (-not (Test-Path $fbDb)) { throw "Failed to create embedded database at $fbDb" }
          Write-Host "Created embedded database: $fbDb ($((Get-Item $fbDb).Length) bytes)"
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_smoke.tcl"
          if ($LASTEXITCODE -ne 0) { throw "tdbc::odbc smoke test failed with exit $LASTEXITCODE" }

      - name: Verify Firebird registration in database.xml + firebird.xml
        shell: pwsh
        env:
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_register.tcl"
          if ($LASTEXITCODE -ne 0) { throw "Firebird registration check failed with exit $LASTEXITCODE" }

      - name: Source-load all src/firebird/*.tcl modules
        shell: pwsh
        env:
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_modules.tcl"
          if ($LASTEXITCODE -ne 0) { throw "Firebird module load failed with exit $LASTEXITCODE" }

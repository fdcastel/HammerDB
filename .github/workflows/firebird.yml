name: Firebird CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/firebird/**"
      - "scripts/tcl/firebird/**"
      - "scripts/python/firebird/**"
      - "config/firebird.xml"
      - "config/database.xml"
      - "config/ci.xml"
      - "Docker/firebird/**"
      - ".github/workflows/firebird.yml"
  push:
    branches:
      - "feature/firebird-**"

permissions:
  contents: read

jobs:
  docker-build:
    name: Linux / Docker build (Firebird image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker build Docker/firebird/
        run: |
          docker build -t hammerdb-firebird:ci Docker/firebird/

      - name: Inspect built image
        run: |
          docker run --rm hammerdb-firebird:ci bash -lc '
            set -eux
            ls -la /usr/lib/x86_64-linux-gnu/libfbclient*
            ls -la /usr/lib/x86_64-linux-gnu/libOdbcFb.so
            grep -A1 "Firebird ODBC Driver" /etc/odbcinst.ini
            isql-fb -z -q </dev/null || true
            tclsh <<<"package require tdbc::odbc; puts \"tdbc::odbc OK [package require tdbc::odbc]\""
          '

      # Exercise libOdbcFb.so end-to-end on Linux: create a fresh .fdb
      # via isql-fb (libfbclient embedded path), then run fb_smoke.tcl
      # + fb_schema.tcl through tclsh inside the container so SQL
      # round-trips through the ODBC driver are actually verified.
      # FB_PASSWORD=masterkey because on Linux FB3 the Legacy_Auth /
      # Srp chain authenticates SYSDBA against security.fdb even for
      # embedded connections (Windows uses Trusted_Auth, so the
      # Windows job leaves FB_PASSWORD unset).
      - name: Linux smoke - create .fdb + run fb_smoke.tcl + fb_schema.tcl
        run: |
          docker run --rm -u 0 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e HAMMERDB_ROOT=/work \
            -e FB_ODBC_DRIVER="Firebird ODBC Driver" \
            -e FB_PASSWORD=masterkey \
            hammerdb-firebird:ci bash -lc '
              set -eux

              # Diagnostic: run the tcl smoke FIRST on its own .fdb so
              # there's no chance the C probe is leaving Engine12 state
              # behind that affects the second open.
              rm -f /tmp/tcl_first.fdb
              echo "CREATE DATABASE '"'"'/tmp/tcl_first.fdb'"'"' USER '"'"'SYSDBA'"'"' PASSWORD '"'"'masterkey'"'"'; QUIT;" | isql-fb -q
              echo "--- tcl-only on a fresh .fdb (no prior probe) ---"
              FB_DB_PATH=/tmp/tcl_first.fdb \
                tclsh .github/workflows/scripts/fb_smoke.tcl || true

              # 1. Smoke: create a fresh .fdb and probe SELECT 1
              rm -f /tmp/smoke.fdb
              echo "CREATE DATABASE '"'"'/tmp/smoke.fdb'"'"' USER '"'"'SYSDBA'"'"' PASSWORD '"'"'masterkey'"'"'; QUIT;" | isql-fb -q
              ls -la /tmp/smoke.fdb

              # C probe to confirm the driver works through bare unixODBC
              gcc -O0 -g -o /tmp/fb_odbc_probe .github/workflows/scripts/fb_odbc_probe.c -lodbc
              echo "--- C probe ---"
              /tmp/fb_odbc_probe "Driver={Firebird ODBC Driver};Dbname=/tmp/smoke.fdb;Client=libfbclient.so.2;UID=SYSDBA;PWD=masterkey;" || true

              echo "--- tcl smoke (real, against a fresh .fdb after probe) ---"
              rm -f /tmp/smoke2.fdb
              echo "CREATE DATABASE '"'"'/tmp/smoke2.fdb'"'"' USER '"'"'SYSDBA'"'"' PASSWORD '"'"'masterkey'"'"'; QUIT;" | isql-fb -q
              FB_DB_PATH=/tmp/smoke2.fdb \
                tclsh .github/workflows/scripts/fb_smoke.tcl

              # 2. Schema: build the full 9-table TPC-C schema
              rm -f /tmp/schema.fdb
              echo "CREATE DATABASE '"'"'/tmp/schema.fdb'"'"' USER '"'"'SYSDBA'"'"' PASSWORD '"'"'masterkey'"'"'; QUIT;" | isql-fb -q
              FB_DB_PATH=/tmp/schema.fdb \
                tclsh .github/workflows/scripts/fb_schema.tcl
            '

  windows-smoke:
    name: Windows / Firebird Embedded smoke
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show runner environment
        shell: pwsh
        run: |
          $PSVersionTable
          choco --version
          Get-ComputerInfo | Select-Object OsName, OsVersion, OsArchitecture

      - name: Install PSFirebird module
        shell: pwsh
        run: |
          Install-Module -Name PSFirebird -Force -Scope CurrentUser -AllowClobber
          Get-Module -ListAvailable PSFirebird | Select-Object Name, Version, Path

      - name: Provision Firebird 5.0.x Embedded
        shell: pwsh
        run: |
          $fbDir = Join-Path $env:RUNNER_TEMP 'firebird'
          Import-Module PSFirebird
          New-FirebirdEnvironment -Version 5.0.3 -Path $fbDir
          Get-ChildItem $fbDir | Select-Object Name, Length
          # Expose fbclient.dll on PATH for the rest of the workflow
          "$fbDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "FIREBIRD_HOME=$fbDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # PSFirebird's [FirebirdEnvironment]::default() picks this up so
          # later workflow steps can call cmdlets without -Environment
          "FIREBIRD_ENVIRONMENT=$fbDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Firebird ODBC driver
        shell: pwsh
        run: |
          choco install firebird-odbc -y --no-progress
          # Locate the registered driver name (32- or 64-bit hive) for downstream steps
          $hives = @(
            'HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers',
            'HKLM:\SOFTWARE\WOW6432Node\ODBC\ODBCINST.INI\ODBC Drivers'
          )
          $found = $null
          foreach ($h in $hives) {
            if (Test-Path $h) {
              $props = Get-ItemProperty $h
              $name = $props.PSObject.Properties.Name | Where-Object { $_ -match 'Firebird' } | Select-Object -First 1
              if ($name) { $found = $name; break }
            }
          }
          if (-not $found) { throw 'Firebird ODBC driver not found in registry after choco install' }
          Write-Host "Registered Firebird ODBC driver: $found"
          "FIREBIRD_ODBC_DRIVER=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare results directory for benchmark JSON artifacts
        shell: pwsh
        run: |
          $resultsDir = Join-Path $env:RUNNER_TEMP 'firebird-results'
          New-Item -ItemType Directory -Path $resultsDir -Force | Out-Null
          "FB_RESULTS_DIR=$resultsDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Benchmark results will be written to $resultsDir"

      - name: Install Tcl/Tk (Magicsplat) for tdbc::odbc smoke test
        shell: pwsh
        run: |
          choco install magicsplat-tcl-tk -y --no-progress
          # Refresh PATH from registry so the just-installed Tcl shows up
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          # Find tclsh in common Magicsplat install locations
          $candidates = @(
            'C:\Tcl\bin', 'C:\Tcl90\bin', 'C:\Tcl86\bin',
            'C:\Program Files\Tcl\bin',
            'C:\Program Files\Magicsplat\Tcl-Tk\bin',
            'C:\Program Files (x86)\Magicsplat\Tcl-Tk\bin'
          )
          $tclsh = $null
          foreach ($dir in $candidates) {
            if (Test-Path $dir) {
              $found = Get-ChildItem -Path $dir -Filter 'tclsh*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $tclsh = $found.FullName; break }
            }
          }
          if (-not $tclsh) {
            # Fall back to a recursive search under C:\ Program Files / C:\Tcl
            $found = Get-ChildItem -Path 'C:\','C:\Program Files\','C:\Program Files (x86)\' -Filter 'tclsh*.exe' -Recurse -ErrorAction SilentlyContinue -Depth 4 | Select-Object -First 1
            if ($found) { $tclsh = $found.FullName }
          }
          if (-not $tclsh) { throw "tclsh.exe not found after magicsplat-tcl-tk install" }
          Write-Host "tclsh: $tclsh"
          $tclshDir = Split-Path -Parent $tclsh
          "TCLSH=$tclsh" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$tclshDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Confirm tdbc::odbc loads
          $verify = Join-Path $env:RUNNER_TEMP 'fb_verify_tdbc.tcl'
          'package require tdbc::odbc; puts "tdbc::odbc [package require tdbc::odbc]"' | Set-Content -Path $verify -Encoding ASCII
          & $tclsh $verify
          if ($LASTEXITCODE -ne 0) { throw "tdbc::odbc not available in $tclsh" }

      # ---------------------------------------------------------------------
      # Embedded-mode ODBC connection string template (canonical, used by
      # src/firebird/fboltp.tcl, fbolap.tcl, fbotc.tcl in later phases):
      #
      #   Driver={Firebird/InterBase(r) driver};
      #   Dbname=<absolute path to .fdb>;
      #   Client=fbclient.dll;
      #   User=SYSDBA;
      #
      # Embedded mode has no host/port. SYSDBA is the implicit owner of any
      # newly-created file; no password is required when fbclient.dll loads
      # the engine in-process. The server-mode legacy form
      # (Servername=localhost) MUST NOT be used.
      # ---------------------------------------------------------------------
      - name: Smoke test - create embedded .fdb and run tdbc::odbc query
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\smoke.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          if (-not (Test-Path $fbDb)) { throw "Failed to create embedded database at $fbDb" }
          Write-Host "Created embedded database: $fbDb ($((Get-Item $fbDb).Length) bytes)"
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_smoke.tcl"
          if ($LASTEXITCODE -ne 0) { throw "tdbc::odbc smoke test failed with exit $LASTEXITCODE" }

      - name: Verify Firebird registration in database.xml + firebird.xml
        shell: pwsh
        env:
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_register.tcl"
          if ($LASTEXITCODE -ne 0) { throw "Firebird registration check failed with exit $LASTEXITCODE" }

      - name: Source-load all src/firebird/*.tcl modules
        shell: pwsh
        env:
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_modules.tcl"
          if ($LASTEXITCODE -ne 0) { throw "Firebird module load failed with exit $LASTEXITCODE" }

      - name: MVCC retry helper unit tests
        shell: pwsh
        env:
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_retry.tcl"
          if ($LASTEXITCODE -ne 0) { throw "MVCC retry tests failed with exit $LASTEXITCODE" }

      - name: Build TPC-C schema on a fresh embedded .fdb
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpcc_schema.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_schema.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-C schema build failed with exit $LASTEXITCODE" }

      - name: Load 1 warehouse worth of TPC-C data + verify row counts
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
          FB_RESULTS_OUT: ${{ env.FB_RESULTS_DIR }}/tpcc-load-1w.json
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpcc_load.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          # Persist the loaded .fdb path for the run-transactions step.
          "FB_LOADED_DB=$($env:FB_DB_PATH)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_load1w.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-C 1-warehouse load failed with exit $LASTEXITCODE" }

      - name: Run 200 TPC-C transactions (client-side mode)
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          FB_DB_PATH: ${{ env.FB_LOADED_DB }}
          FB_TXN_COUNT: "200"
          HAMMERDB_ROOT: ${{ github.workspace }}
          FB_RESULTS_OUT: ${{ env.FB_RESULTS_DIR }}/tpcc-transactions.json
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_runtxn.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-C transaction run failed with exit $LASTEXITCODE" }

      - name: Install all 5 TPC-C PSQL stored procedures via isql
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSFirebird
          $sql = Get-Content -Path "${{ github.workspace }}\.github\workflows\scripts\fb_tpcc_sps.sql" -Raw
          # FB_LOADED_DB is in forward-slash form for tdbc; isql wants the platform path.
          $fbDbForIsql = $env:FB_LOADED_DB.Replace('/', '\')
          Write-Host "Installing PAYMENT_SP/OSTAT_SP/SLEV_SP/DELIVERY_SP/NEWORD_SP into $fbDbForIsql"
          # Pass SYSDBA credentials via isql args (the .fdb was created
          # by New-FirebirdDatabase with default SYSDBA/masterkey).
          $out = Invoke-FirebirdIsql -Database $fbDbForIsql -Sql $sql -- -u SYSDBA -p masterkey
          Write-Host $out

      - name: Smoke PSQL stored procedure (PAYMENT_SP via tdbc::odbc)
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          FB_DB_PATH: ${{ env.FB_LOADED_DB }}
          HAMMERDB_ROOT: ${{ github.workspace }}
          FB_RESULTS_OUT: ${{ env.FB_RESULTS_DIR }}/tpcc-stored-procs.json
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_storedprocs.tcl"
          if ($LASTEXITCODE -ne 0) { throw "Stored proc smoke failed with exit $LASTEXITCODE" }

      - name: Build TPC-H schema on a fresh embedded .fdb
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpch_schema.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          # Persist for the next step (queries reuse the same .fdb)
          "FB_TPCH_DB=$($env:FB_DB_PATH)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_tpch_schema.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-H schema build failed with exit $LASTEXITCODE" }

      - name: PREPARE all 22 TPC-H queries against the empty schema
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          FB_DB_PATH: ${{ env.FB_TPCH_DB }}
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_tpch_queries.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-H query PREPARE check failed with exit $LASTEXITCODE" }

      - name: Load TPC-H at scale 0.01 + run a few queries
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
          FB_TPCH_SCALE: "0.01"
          FB_RESULTS_OUT: ${{ env.FB_RESULTS_DIR }}/tpch-load.json
        run: |
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpch_load.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          Import-Module PSFirebird
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          # Persist for the power-test step (reuses the loaded .fdb)
          "FB_TPCH_LOADED_DB=$($env:FB_DB_PATH)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_tpch_load.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-H load + query smoke failed with exit $LASTEXITCODE" }

      - name: Run full TPROC-H power test (RF1 + 22 queries + RF2)
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          FB_DB_PATH: ${{ env.FB_TPCH_LOADED_DB }}
          HAMMERDB_ROOT: ${{ github.workspace }}
          FB_RESULTS_OUT: ${{ env.FB_RESULTS_DIR }}/tpch-power.json
        run: |
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_tpch_power.tcl"
          if ($LASTEXITCODE -ne 0) { throw "TPC-H power test failed with exit $LASTEXITCODE" }

      - name: Run TPROC-H throughput test (server mode, multi-VU)
        shell: pwsh
        env:
          FB_ODBC_DRIVER: ${{ env.FIREBIRD_ODBC_DRIVER }}
          HAMMERDB_ROOT: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSFirebird

          # Embedded mode is single-process, so we cannot share the
          # already-loaded .fdb. Provision a dedicated .fdb and load
          # it via embedded first, then start a Firebird server on
          # port 3050 pointing at it for the multi-VU test.
          $fbDb = Join-Path $env:RUNNER_TEMP 'firebird\tpch_throughput.fdb'
          if (Test-Path $fbDb) { Remove-Item $fbDb -Force }
          New-FirebirdDatabase -Database $fbDb -Force
          $env:FB_DB_PATH = ($fbDb -replace '\\', '/')
          $env:FB_TPCH_SCALE = "0.01"
          Write-Host "Loading throughput .fdb (scale 0.01) via embedded..."
          & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_tpch_load.tcl"
          if ($LASTEXITCODE -ne 0) { throw "throughput load failed with exit $LASTEXITCODE" }

          # Modern Firebird (3+) stores users in security<N>.fdb under
          # the SRP plugin and ships the security DB EMPTY. The
          # straightforward `CREATE USER SYSDBA` from an embedded
          # session fails with "No permission for CREATE TABLE
          # PLG$SRP" because the OS user isn't auto-promoted to
          # security-DB admin. Workaround: enable Legacy_Auth in
          # firebird.conf, which uses the older user storage and has
          # the well-known SYSDBA/masterkey credentials baked in.
          $fbConf = Join-Path $env:FIREBIRD_HOME 'firebird.conf'
          Write-Host "Enabling Legacy_Auth in $fbConf..."
          Write-FirebirdConfiguration -Path $fbConf -Configuration @{
              'AuthServer'    = 'Legacy_Auth, Srp'
              'AuthClient'    = 'Legacy_Auth, Srp'
              'UserManager'   = 'Legacy_UserManager, Srp'
              'WireCrypt'     = 'Disabled'
          }

          Write-Host "Starting Firebird server on port 3050..."
          $instance = Start-FirebirdInstance -Port 3050
          # Give the server a moment to bind the port. PSFirebird's
          # cmdlet returns immediately after Start-Process; the actual
          # listener takes 1-3s to come up.
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                  $tcp = New-Object System.Net.Sockets.TcpClient
                  $tcp.Connect('127.0.0.1', 3050)
                  $tcp.Close()
                  $ready = $true
                  break
              } catch { }
          }
          if (-not $ready) { throw "Firebird server did not bind port 3050 within 15s" }
          Write-Host "Firebird server PID $($instance.Process.Id) ready"

          $resultsJson = Join-Path $env:FB_RESULTS_DIR 'tpch-throughput.json'
          $env:FB_TPCH_SERVER_HOST = "localhost"
          $env:FB_TPCH_SERVER_PORT = "3050"
          $env:FB_TPCH_DBPATH = $fbDb
          $env:FB_TPCH_STREAMS = "2"
          $env:FB_TPCH_RESULTS_OUT = $resultsJson

          try {
              & $env:TCLSH "${{ github.workspace }}\.github\workflows\scripts\fb_tpch_throughput.tcl"
              if ($LASTEXITCODE -ne 0) { throw "throughput test failed with exit $LASTEXITCODE" }
          } finally {
              Write-Host "Stopping Firebird server..."
              try { Stop-FirebirdInstance -Id $instance.Process.Id } catch {
                  Write-Warning "Stop-FirebirdInstance failed: $_"
                  # Fall back to taskkill if PSFirebird couldn't stop it.
                  try { Stop-Process -Id $instance.Process.Id -Force -ErrorAction SilentlyContinue } catch {}
              }
          }

      - name: Upload all Firebird benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firebird-benchmark-results
          path: ${{ env.FB_RESULTS_DIR }}/*.json
          if-no-files-found: warn

      # Running hammerdbcli end-to-end is deferred: the HammerDB
      # Windows release ships as a self-contained .exe with the entire
      # source/lib tree bundled via zipfs - the binary can't be
      # patched to use our updated src/firebird/ and
      # config/database.xml without rebuilding the .exe via the Bawt
      # build system. The standalone tdbc::odbc CI verifications above
      # cover the same code paths.
